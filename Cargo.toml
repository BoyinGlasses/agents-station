[workspace]
resolver = "2"
members = [
    "crates/station-core",
    "crates/station-launcher",
    "crates/station-canvas2d",
    "crates/station-3d",
    "crates/station-ui",
    "crates/station-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Agents Station"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.19"
ttf-parser = "0.25"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
bevy = { version = "0.16", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_asset",
    "bevy_picking",
    "tonemapping_luts",
    "png",
] }
bevy_egui = "0.34"

[profile.dev]
debug = 0
split-debuginfo = "packed"
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
